[markup]
  # Yazılar ## ve ### başlıklarıyla yazılıyor; İçindekiler bu iki seviyeyi gösterir.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  # Renkler satır içi değil CSS sınıflarıyla gelir (assets/css/syntax.css), böylece
  # kod blokları açık ve koyu temaya birlikte uyar.
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    # Çok dilli sitelerde Hugo'nun gömülü link render hook'u otomatik açılıyor ve
    # /kart/ gibi static/ altındaki (aynı zamanda assets olarak mount edilen) klasörlere
    # verilen linkleri kaynak olarak yayınlamaya çalışıp build'i kırıyor. İçerikteki
    # linkler zaten dil önekiyle tam yazılıyor, o yüzden kapalı.
    [markup.goldmark.renderHooks.link]
      useEmbedded = "never"
    [markup.goldmark.renderer]
      # Kapalı kalmalı. Açılırsa Markdown içindeki ham HTML olduğu gibi basılır; bu sadece
      # yazıları değil, ön bilgi alanlarını markdownify ile basan şablonları da etkiler:
      # layouts/index.html (headline | markdownify) ve layouts/post/single.html
      # (updates[].note | markdownify) ham HTML'e açılır.
      unsafe = false
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[mediaTypes]
  [mediaTypes.'font/woff']
