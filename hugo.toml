baseURL = "https://melwis880.github.io/"
title = "M. Meriç Ordu"

# İki dilli site: İngilizce kök adreste (/), Türkçe /tr/ altında. Dil başına
# değişen başlık satırı, SEO metinleri ve menüler aşağıdaki [languages] bloğunda.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Saat yazılmamış tarihler (date: 2026-10-10) TR saatiyle okunur. CI UTC'de çalıştığı için bu
# olmadan gece yarısından sonra (TR) push edilen bir yazı/sayfa "gelecekte" sayılıp build'den düşer.
timeZone = "Europe/Istanbul"

[outputs]
home = ["HTML", "RSS"]

[params]
  # Görseller assets/img/ altında; resources.Get ile okunup WebP'ye çevriliyor.
  header_image = "img/head_image1.jpg"   # og:image
  avatar = "img/profil-buyuk.png"        # başlıktaki ve yazı sonundaki avatar

  [params.social]
  rss            = true
  email          = "muharremmeric.ordu@gmail.com"
  twitter        = "https://x.com/atlas_tabip"
  linkedin       = "https://www.linkedin.com/in/mericordu"
  github         = "https://github.com/Melwis880"

# --- DİLLER VE MENÜLER ---
# Menü URL'leri dil önekiyle birlikte tam yazılır (partials/site/header.html bunları
# relURL ile basar), böylece /kart/ gibi tek dilli statik sayfalar /tr/kart/ olarak bozulmaz.

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    [languages.en.params]
      SEOTitle = "AI Automation Consultant"
      description = "AI Automation Consultant and Computer Engineering student. Case studies on n8n, API and LLM automations that take manual work off small businesses and professionals."
      keyword = "M. Meriç Ordu, AI automation, AI consultant, n8n, LLM, AI agents, Python, Claude Code, SME automation"
      tagline = "AI Automation Consultant | Computer Engineering Student"
    # Ana sayfaya isim/avatar götürüyor; kartvizit (/kart/) menüde değil, alt bilgide.
    [[languages.en.menus.main]]
      name = "Writing"
      url = "/post/"
      weight = 1
    [[languages.en.menus.main]]
      name = "Projects"
      url = "/projects/"
      weight = 2
    [[languages.en.menus.main]]
      name = "About"
      url = "/about/"
      weight = 3

  [languages.tr]
    label = "Türkçe"
    locale = "tr-TR"
    weight = 2
    # GitHub Pages sadece kökteki /404.html'i sunar (Türkçe satır onun içinde). /tr/404.html hiç
    # 404 olarak gösterilmiyordu, kök 404'ün dil düğmesi de oraya gidiyordu; artık /tr/'ye gider.
    disableKinds = ["404"]
    [languages.tr.params]
      SEOTitle = "Yapay Zeka Otomasyon Danışmanı"
      description = "Yapay zeka otomasyon danışmanı ve Bilgisayar Mühendisliği öğrencisi. KOBİ'lerin ve profesyonellerin elle yaptığı işleri azaltan n8n, API ve LLM otomasyonları üzerine vaka analizleri."
      keyword = "M. Meriç Ordu, yapay zeka otomasyonu, yapay zeka danışmanı, n8n, LLM, yapay zeka ajanları, Python, Claude Code, KOBİ otomasyonu"
      tagline = "Yapay Zeka Otomasyon Danışmanı | Bilgisayar Mühendisliği Öğrencisi"
    [[languages.tr.menus.main]]
      name = "Yazılar"
      url = "/tr/post/"
      weight = 1
    [[languages.tr.menus.main]]
      name = "Projeler"
      url = "/tr/projeler/"
      weight = 2
    [[languages.tr.menus.main]]
      name = "Hakkımda"
      url = "/tr/hakkimda/"
      weight = 3


[markup]
  # Yazılar ## ve ### başlıklarıyla yazılıyor; İçindekiler bu iki seviyeyi gösterir.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  # Renkler satır içi değil CSS sınıflarıyla gelir (assets/css/syntax.css), böylece
  # kod blokları açık ve koyu temaya birlikte uyar.
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    # Çok dilli sitelerde Hugo'nun gömülü link render hook'u otomatik açılıyor. Eskiden
    # static/ aynı zamanda assets olarak mount edildiği için /kart/ linkini kaynak olarak
    # yayınlamaya çalışıp build'i kırıyordu. O mount artık yok, ama içerikteki linkler zaten
    # dil önekiyle tam yazıldığı için kapalı kalıyor; açmak ayrı bir test ister.
    [markup.goldmark.renderHooks.link]
      useEmbedded = "never"
    [markup.goldmark.renderer]
      # Kapalı kalmalı. Açılırsa Markdown içindeki ham HTML olduğu gibi basılır; bu sadece
      # yazıları değil, ön bilgi alanlarını markdownify ile basan şablonları da etkiler:
      # layouts/index.html (headline | markdownify) ve layouts/post/single.html
      # (updates[].note | markdownify) ham HTML'e açılır.
      unsafe = false
