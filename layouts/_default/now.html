{{- /*
  /now sayfası (layout: now). Ayda bir güncellenir: ön bilgideki lastmod tarihi ve maddeler.
  Tarih sayfanın en üstünde "Güncellendi: ..." olarak görünür.
*/ -}}
{{ define "main" }}
<div class="container" data-pagefind-meta="type:{{ i18n "type-page" }}">
  <h1 class="page-title" data-pagefind-meta="title">{{ .Title }}</h1>
  <p class="meta now-updated">
    <span>{{ i18n "lastUpdated" }} <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod | time.Format ":date_long" }}</time></span>
  </p>
  <div class="prose now" data-pagefind-body>
    {{ .Content }}
  </div>
</div>
{{ end }}
